    <h1>Gathering I Photoshoot</h1>

        src="https://ieufbiuehfuw2.github.io/Gathering_1/preview.png"

</body>
<body>
    <div id="viewer"></div>

    <script src="./openseadragon.min.js"></script>
    <script>
        const config = {
            image: "./stitched.png",
        };

        const viewer = OpenSeadragon({
            id: "viewer",
            prefixUrl: "./images/",
            showNavigator: true,
            navigatorPosition: "BOTTOM_LEFT",
            navigatorWidth: 200,
            navigatorHeight: 120,
            tileSources: {
                type: 'image',
                url: config.image
            },
            zoomPerClick: 2,
            zoomPerScroll: 1.2,
            gestureSettingsMouse: {
                clickToZoom: true,
                dblClickToZoom: true,
                scrollToZoom: true,
                pinchToZoom: true
            },
            maxZoomPixelRatio: 2,
            minZoomImageRatio: 0.1,

            tweeningTime: 0.2,
            tweeningDuration: 0.3,
            showNavigationControl: true,
            showZoomControl: true,
            showHomeControl: true,
            showFullPageControl: true,
            showSequenceControl: false,
            preserveViewport: false,
        });

        viewer.addHandler('page', function(event) {
            document.getElementById('info').textContent = `Page: ${event.page + 1}`;
        });

        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case '+':
                case '=':
                    viewer.viewport.zoomBy(1.2);
                    viewer.viewport.applyConstraints();
                    e.preventDefault();
                    break;
                case '-':
                    viewer.viewport.zoomBy(0.8);
                    viewer.viewport.applyConstraints();
                    e.preventDefault();
                    break;
                case '0':
                    viewer.viewport.goHome();
                    e.preventDefault();
                    break;
                case 'f':
                    viewer.viewport.fitBounds(viewer.source.getNaturalBounds().clone());
                    e.preventDefault();
                    break;
            }
        });

        viewer.addHandler('open-failed', function(event) {
            document.getElementById('info').textContent = 'Failed to download!';
            console.error('OpenSeadragon error:', event);
        });
    </script>
</body>
</html>
